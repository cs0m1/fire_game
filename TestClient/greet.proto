syntax = "proto3";

// This tells the generator what C# namespace to use
option csharp_namespace = "MyGrpcApp";

package greet;

// The Service defines the methods you can call
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
}

// The Messages define the data being sent
message HelloRequest {
  string name = 1; 
}

message HelloReply {
  string message = 1;
}
