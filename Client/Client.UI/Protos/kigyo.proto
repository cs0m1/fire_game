syntax = "proto3";

// The package name helps avoid name collisions
package data_processor;

// Service definition
service DataProcessor {
  // Simple Unary RPC: Send a request, get a response
  rpc ProcessData (ProcessRequest) returns (ProcessResponse);

  // Server Streaming RPC: Send one request, get multiple updates
  rpc MonitorTask (MonitorRequest) returns (stream MonitorResponse);
}

// Request message for ProcessData
message ProcessRequest {
  string task_id = 1;         // Python code will use 'task_id'
  bytes raw_payload = 2;
  int32 priority_level = 3;
}

// Response message for ProcessData
message ProcessResponse {
  bool success = 1;
  string message = 2;
  float processing_time_ms = 3;
}

// Request for MonitorTask
message MonitorRequest {
  string task_id = 1;
}

// Response for MonitorTask (Streaming)
message MonitorResponse {
  string status = 1;
  int32 percent_complete = 2;
}